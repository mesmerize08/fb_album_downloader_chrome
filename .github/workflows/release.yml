name: Release

# Tag a release with the version from manifest.json, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds the release ZIP and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag is $TAG_VERSION but manifest.json says $MANIFEST_VERSION."
            exit 1
          fi
          echo "Releasing version $MANIFEST_VERSION."

      - name: Build the release ZIP
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          STAGE="$RUNNER_TEMP/fb-album-downloader"
          mkdir -p "$STAGE"
          # Only the runtime files. Tests, docs, tooling and CI config are not
          # part of what a user loads into Chrome.
          cp manifest.json LICENSE "$STAGE/"
          cp background.js "$STAGE/"
          cp -r shared content sidepanel icons "$STAGE/"
          (cd "$STAGE" && zip -r -X "$GITHUB_WORKSPACE/fb-album-downloader-$VERSION.zip" .)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          unzip -l "fb-album-downloader-$VERSION.zip"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fb-album-downloader-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            Install from source, or download the ZIP below, unzip it, and load
            the folder through `chrome://extensions` → Developer mode → Load
            unpacked. See the [changelog](CHANGELOG.md) for what changed.

      - name: Upload the ZIP as a build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: fb-album-downloader-${{ env.VERSION }}
          path: fb-album-downloader-${{ env.VERSION }}.zip
